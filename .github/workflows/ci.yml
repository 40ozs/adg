# Quality gates for ADG. The same checks the developer scripts run locally.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # Decides which suites a change can affect, from everything the branch changes relative to main (not just
  # the last push), so a branch that touched the backend anywhere always runs the backend. main, workflow
  # edits, and anything unclear run everything.
  changes:
    name: Changed areas
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Linux, X64, docker, adg]
    outputs:
      backend: ${{ steps.areas.outputs.backend }}
      frontend: ${{ steps.areas.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: areas
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          all() { echo "backend=true" >> "$GITHUB_OUTPUT"; echo "frontend=true" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$GITHUB_REF" = refs/heads/main ] && all
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then range="$PR_BASE...$PR_HEAD"; else range="origin/main...$GITHUB_SHA"; fi
          files=$(git diff --name-only "$range") || all
          [ -n "$files" ] || all
          grep -q '^\.github/' <<<"$files" && all
          be=false; fe=false
          grep -qvE '^(frontend/|docs/|collector/)|\.md$' <<<"$files" && be=true
          grep -qvE '^(backend/|database/|docs/|collector/)|\.md$' <<<"$files" && fe=true
          echo "backend=$be" >> "$GITHUB_OUTPUT"; echo "frontend=$fe" >> "$GITHUB_OUTPUT"
          printf 'changed files:\n%s\nbackend=%s frontend=%s\n' "$files" "$be" "$fe"

  backend:
    name: Backend (lint, types, tests)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    # adg-db = the k3s-adg-db runner set, which prefers the bare-metal node (fast fsync) for the PostgreSQL suite.
    runs-on: [self-hosted, Linux, X64, docker, adg-db]
    defaults:
      run:
        working-directory: backend
    # The database tests are a real gate, not an optional local nicety: migrations,
    # idempotent ingestion, and every graph query run only against PostgreSQL.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: adg
          POSTGRES_PASSWORD: adg_ci_password
          POSTGRES_DB: adg
        ports:
          - 5432:5432
        # Data dir on a RAM disk: the database is thrown away after the job, so durable fsyncs only cost time.
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U adg -d adg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ADG_DATABASE_URL: postgresql+psycopg://adg:adg_ci_password@localhost:5432/adg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Type check
        run: python -m mypy app tests
      - name: Unit tests
        run: python -m pytest -q -m "not smoke"
      - name: Database tests
        env:
          ADG_RUN_SMOKE_TESTS: "1"
        run: python -m pytest -q -m smoke

  frontend:
    name: Frontend (lint, types, tests, build)
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: [self-hosted, Linux, X64, docker, adg]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build

  collector:
    name: Collector (Pester)
    # The configured self-hosted pool is Linux. Keep this Windows-specific gate hosted.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
      # Every collector suite: Active Directory, SMB, and NTFS. Unscoped on purpose - a
      # collector that lands tests CI never runs is a collector nobody is checking, and the
      # script fails rather than passes when it discovers nothing.
      - name: Collector tests
        shell: pwsh
        run: ./scripts/collector-test.ps1

  compose:
    name: Docker Compose configuration
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Linux, X64, docker, adg]
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config -q

  fork-linux:
    name: Fork PR Linux gates (GitHub-hosted)
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: adg
          POSTGRES_PASSWORD: adg_ci_password
          POSTGRES_DB: adg
        ports:
          - 5432:5432
        # Data dir on a RAM disk: the database is thrown away after the job, so durable fsyncs only cost time.
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U adg -d adg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ADG_DATABASE_URL: postgresql+psycopg://adg:adg_ci_password@localhost:5432/adg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Backend lint, types, and tests
        working-directory: backend
        env:
          ADG_RUN_SMOKE_TESTS: "1"
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy app tests
          python -m pytest -q -m "not smoke"
          python -m pytest -q -m smoke
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend gates
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm run typecheck
          npm run test
          npm run build
      - name: Validate compose file
        run: docker compose config -q
