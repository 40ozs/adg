# Quality gates for ADG. The same checks the developer scripts run locally.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # The database tests are a real gate, not an optional local nicety: migrations,
    # idempotent ingestion, and every graph query run only against PostgreSQL.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: adg
          POSTGRES_PASSWORD: adg_ci_password
          POSTGRES_DB: adg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adg -d adg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ADG_DATABASE_URL: postgresql+psycopg://adg:adg_ci_password@localhost:5432/adg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Type check
        run: python -m mypy app tests
      - name: Unit tests
        run: python -m pytest -q -m "not smoke"
      - name: Database tests
        env:
          ADG_RUN_SMOKE_TESTS: "1"
        run: python -m pytest -q -m smoke

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build

  collector:
    name: Collector (Pester)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
      # Every collector suite: Active Directory, SMB, and NTFS. Unscoped on purpose - a
      # collector that lands tests CI never runs is a collector nobody is checking, and the
      # script fails rather than passes when it discovers nothing.
      - name: Collector tests
        shell: pwsh
        run: ./scripts/collector-test.ps1

  compose:
    name: Docker Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config -q
